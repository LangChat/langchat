name: 缺陷报告
description: 报告可以稳定复现的问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: 感谢你帮助改进 LangChat。安全漏洞请按照 SECURITY.md 私下报告。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 说明实际行为以及它为何构成问题。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 提供最小、完整且可重复的步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交
      placeholder: v2026.1 或 commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、JDK、Node.js、数据库和浏览器版本。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 提交前请移除令牌、密码、个人数据和内部地址。
