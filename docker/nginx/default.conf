# ==============================================================================
# LangChat 一体化镜像内的 Nginx 配置
#
# 对外只暴露 80 端口：
#   /api/**     反向代理到同容器的 Spring Boot（127.0.0.1:8080）
#   /healthz    健康检查（供 Docker HEALTHCHECK 使用）
#   其余路径    托管前端静态资源，SPA 路由回退到 index.html
# ==============================================================================

# 后端上游：容器内为 127.0.0.1，与 Nginx 同进程组
upstream langchat_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# SSE / 流式对话需要关闭缓冲，单独定义代理参数
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 500m;
    server_tokens off;

    # 访问日志与错误日志（目录已挂载为卷）
    access_log /var/log/nginx/langchat.access.log;
    error_log  /var/log/nginx/langchat.error.log warn;

    # --------------------------------------------------------------------------
    # 容器健康检查：不经过后端，仅证明 Nginx 存活
    # --------------------------------------------------------------------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # --------------------------------------------------------------------------
    # 后端 API 反向代理
    #
    # 前端 VITE_GLOB_API_URL=/api，后端控制器本身挂在 /api/v1/**，
    # 因此这里保持路径原样转发（不做 rewrite）。
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://langchat_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 支持 WebSocket 升级（MCP / 实时通道）；普通请求时该头为空，走短连接
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # AI 对话为 SSE 流式响应，必须关闭代理缓冲并放宽超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # --------------------------------------------------------------------------
    # 前端静态资源
    # --------------------------------------------------------------------------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:js|css|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # index.html 不做缓存，保证发布后即时生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 隐藏文件拒绝访问
    location ~ /\. {
        deny all;
    }
}
