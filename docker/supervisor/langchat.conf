; ==============================================================================
; LangChat 一体化镜像的进程管理配置
;
; 由 Supervisor 同时托管 Nginx 与 Spring Boot：
;   - 任一进程异常退出会被自动拉起
;   - 两者日志统一输出到容器 stdout/stderr，便于 docker logs 查看
; ==============================================================================

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=3
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:langchat-server]
; 工作目录固定，确保 logback 的相对日志路径 logs/ 落在 $LANGCHAT_HOME/logs
directory=/opt/langchat
command=/bin/bash -c 'exec java $JAVA_OPTS -jar /opt/langchat/app.jar --spring.config.additional-location=file:${LANGCHAT_CONFIG_FILE:-/opt/langchat/config/application-docker.yml}'
autostart=true
autorestart=true
startsecs=20
startretries=5
priority=20
; 后端启动较慢（Spring 上下文 + 数据源连接），给足停止时间
stopwaitsecs=30
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=TZ="Asia/Shanghai"
