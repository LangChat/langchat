      <circle cx="8" cy="76" r="4" fill="#35AEB2"/>
      <text x="24" y="82" fill="#17191D" font-size="15" font-weight="650">长期记忆与独立会话工作空间</text>
      <circle cx="8" cy="118" r="4" fill="#ED654F"/>
      <text x="24" y="124" fill="#17191D" font-size="15" font-weight="650">多智能体协同与沙箱执行</text>
      <circle cx="8" cy="160" r="4" fill="#4E9A62"/>
      <text x="24" y="166" fill="#17191D" font-size="15" font-weight="650">安全治理、私有化部署与交付</text>
      <path d="M0 198H328" stroke="#D7DAD5"/>
