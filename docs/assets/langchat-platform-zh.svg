    <rect x="800" y="382" width="328" height="58" rx="6" fill="#17191D"/>
    <text x="824" y="417" fill="#FFFFFF" font-size="15" font-weight="700">了解 LangChat Agentic 商业版</text>
    <path d="M1084 404l12 7-12 7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="64" y="466" fill="#17191D" font-size="14" font-weight="700">LangChat Team</text>
    <text x="184" y="466" fill="#676D76" font-size="14">langchat.cn</text>
    <text x="1128" y="466" fill="#676D76" font-size="12" text-anchor="end">v2026.1</text>
