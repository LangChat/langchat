  <text x="800" y="94" fill="#17191D" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="680">Enterprise AI applications</text>
  <text x="800" y="119" fill="#676D76" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">Procurement, delivery, governance, and operations</text>

