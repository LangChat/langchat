<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">LangChat open-source AI agent application platform</title>
  <desc id="desc">LangChat connects agent building, knowledge RAG, Skills and MCP, and conversational analytics. LangChat Agentic extends the platform for enterprise procurement and production operations.</desc>

