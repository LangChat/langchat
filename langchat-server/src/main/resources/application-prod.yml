spring:
  config:
    activate:
      on-profile: prod
  datasource:
    mysql:
      url: ${LANGCHAT_MYSQL_URL}
      username: ${LANGCHAT_MYSQL_USERNAME}
      password: ${LANGCHAT_MYSQL_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver

management:
  endpoint:
    health:
      show-details: never

langchat:
  auth:
    super-admin-username: ${LANGCHAT_ADMIN_USERNAME}
    local-users:
      - user-id: ${LANGCHAT_ADMIN_USER_ID}
        username: ${LANGCHAT_ADMIN_USERNAME}
        password: ${LANGCHAT_ADMIN_PASSWORD}
        display-name: ${LANGCHAT_ADMIN_DISPLAY_NAME:System Admin}
        tenant-id: ${LANGCHAT_ADMIN_TENANT_ID:default}
        roles:
          - SUPER_ADMIN
        permissions:
          - auth:login
          - auth:logout
          - auth:me
