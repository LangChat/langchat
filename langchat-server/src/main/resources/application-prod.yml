spring:
  config:
    activate:
      on-profile: prod
  datasource:
    mysql:
      url: ${LANGCHAT_MYSQL_URL}
      username: ${LANGCHAT_MYSQL_USERNAME}
      password: ${LANGCHAT_MYSQL_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver

management:
  endpoint:
    health:
      show-details: never

langchat:
  skill:
    # 相对路径以 JAR 进程的运行目录为基准，也可配置为持久化绝对路径
    workspace-dir: ${LANGCHAT_SKILL_WORKSPACE_DIR:./langchat-workspace}
  storage:
    type: ${LANGCHAT_STORAGE_TYPE:local}
    local-base-dir: ${LANGCHAT_LOCAL_STORAGE_DIR:/opt/langchat/oss}
    s3:
      access-key: ${AMAZON_S3_ACCESS_KEY:}
      secret-key: ${AMAZON_S3_SECRET_KEY:}
      bucket-name: ${AMAZON_S3_BUCKET_NAME:langchat}
      # S3 服务地址末尾不要添加斜杠；使用 AWS S3 时可留空。
      end-point: ${AMAZON_S3_END_POINT:}
      region: ${AMAZON_S3_REGION:us-east-1}
      path-style-access-enabled: ${AMAZON_S3_PATH_STYLE_ACCESS_ENABLED:true}
      # 生产环境建议由运维预先创建 Bucket，并将此项设置为 false。
      auto-create-bucket: ${AMAZON_S3_AUTO_CREATE_BUCKET:false}
  core:
    docling:
      # Docling 文档解析（需独立部署 docling-serve）。开启后文档导入可选择
      # DOCLING/AUTO 解析模式；未开启时统一走内置 Tika/PDFBox 解析。
      # 生产环境 base-url 必须显式配置，不提供本地默认值。
      enabled: ${LANGCHAT_DOCLING_ENABLED:false}
      base-url: ${LANGCHAT_DOCLING_BASE_URL:}
      timeout-seconds: 300
  auth:
    super-admin-username: ${LANGCHAT_ADMIN_USERNAME}
    local-users:
      - user-id: ${LANGCHAT_ADMIN_USER_ID}
        username: ${LANGCHAT_ADMIN_USERNAME}
        password: ${LANGCHAT_ADMIN_PASSWORD}
        display-name: ${LANGCHAT_ADMIN_DISPLAY_NAME:System Admin}
        tenant-id: ${LANGCHAT_ADMIN_TENANT_ID:default}
        roles:
          - SUPER_ADMIN
        permissions:
          - auth:login
          - auth:logout
          - auth:me
