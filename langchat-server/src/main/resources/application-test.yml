spring:
  config:
    activate:
      on-profile: test
  datasource:
    mysql:
      url: ${LANGCHAT_TEST_MYSQL_URL:jdbc:mysql://localhost:3306/langchat_test?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
      username: ${LANGCHAT_TEST_MYSQL_USERNAME:root}
      password: ${LANGCHAT_TEST_MYSQL_PASSWORD:}
      driver-class-name: com.mysql.cj.jdbc.Driver

management:
  endpoint:
    health:
      show-details: always

langchat:
  auth:
    super-admin-username: ${LANGCHAT_TEST_ADMIN_USERNAME:admin}
    local-users:
      - user-id: ${LANGCHAT_TEST_ADMIN_USER_ID:admin}
        username: ${LANGCHAT_TEST_ADMIN_USERNAME:admin}
        password: ${LANGCHAT_TEST_ADMIN_PASSWORD:}
        display-name: ${LANGCHAT_TEST_ADMIN_DISPLAY_NAME:System Admin}
        tenant-id: ${LANGCHAT_TEST_ADMIN_TENANT_ID:default}
        roles:
          - SUPER_ADMIN
        permissions:
          - auth:login
          - auth:logout
          - auth:me
