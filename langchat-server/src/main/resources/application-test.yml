spring:
  config:
    activate:
      on-profile: test
  datasource:
    mysql:
      url: ${LANGCHAT_TEST_MYSQL_URL:jdbc:mysql://localhost:3306/langchat_test?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
      username: ${LANGCHAT_TEST_MYSQL_USERNAME:root}
      password: ${LANGCHAT_TEST_MYSQL_PASSWORD:}
      driver-class-name: com.mysql.cj.jdbc.Driver

management:
  endpoint:
    health:
      show-details: always

langchat:
  skill:
    # 相对路径以 JAR 进程的运行目录为基准
    workspace-dir: ${LANGCHAT_SKILL_WORKSPACE_DIR:./langchat-workspace}
  storage:
    type: ${LANGCHAT_TEST_STORAGE_TYPE:local}
    local-base-dir: ${LANGCHAT_TEST_LOCAL_STORAGE_DIR:/tmp/langchat-test-oss}
    s3:
      access-key: ${AMAZON_S3_TEST_ACCESS_KEY:change-me}
      secret-key: ${AMAZON_S3_TEST_SECRET_KEY:change-me}
      bucket-name: ${AMAZON_S3_TEST_BUCKET_NAME:langchat-test}
      # 测试环境必须使用独立 Bucket，避免污染开发或生产对象。
      end-point: ${AMAZON_S3_TEST_END_POINT:http://127.0.0.1:9000}
      region: ${AMAZON_S3_TEST_REGION:us-east-1}
      path-style-access-enabled: ${AMAZON_S3_TEST_PATH_STYLE_ACCESS_ENABLED:true}
      auto-create-bucket: ${AMAZON_S3_TEST_AUTO_CREATE_BUCKET:true}
  core:
    docling:
      # Docling 文档解析（需独立部署 docling-serve）。开启后文档导入可选择
      # DOCLING/AUTO 解析模式；未开启时统一走内置 Tika/PDFBox 解析。
      enabled: ${LANGCHAT_TEST_DOCLING_ENABLED:false}
      base-url: ${LANGCHAT_TEST_DOCLING_BASE_URL:http://127.0.0.1:5001}
      timeout-seconds: 300
  auth:
    super-admin-username: ${LANGCHAT_TEST_ADMIN_USERNAME:admin}
    local-users:
      - user-id: ${LANGCHAT_TEST_ADMIN_USER_ID:admin}
        username: ${LANGCHAT_TEST_ADMIN_USERNAME:admin}
        password: ${LANGCHAT_TEST_ADMIN_PASSWORD:}
        display-name: ${LANGCHAT_TEST_ADMIN_DISPLAY_NAME:System Admin}
        tenant-id: ${LANGCHAT_TEST_ADMIN_TENANT_ID:default}
        roles:
          - SUPER_ADMIN
        permissions:
          - auth:login
          - auth:logout
          - auth:me
