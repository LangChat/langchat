spring:
  application:
    name: langchat-server
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 520MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

sa-token:
  token-name: Authorization
  is-read-header: true
  is-read-cookie: false
  is-log: false
  is-print: false

langchat:
  storage:
    type: local
    local-base-dir: /tmp/langchat-oss
  skill:
    # 技能工作区根目录；相对路径以 JAR 进程的运行目录为基准
    workspace-dir: ${LANGCHAT_SKILL_WORKSPACE_DIR:./langchat-workspace}
  mcp:
    # MCP 客户端会话缓存时长：窗口内多次 Agent 调用复用同一个 MCP 服务连接，不重复启动；
    # 过期自动回收，配置变更/删除时立即停用（主动暂停）
    session-ttl: 1h
    sweep-interval: 5m
    tool-execution-timeout: 30s
